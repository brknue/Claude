const DATA=[["Hello","Hallo","Merhaba","Hola","Bonjour","Ciao"],["Good morning","Guten Morgen","Günaydın","Buenos días","Bonjour","Buongiorno"],["Good evening","Guten Abend","İyi akşamlar","Buenas tardes","Bonsoir","Buonasera"],["Goodbye","Auf Wiedersehen","Hoşça kal","Adiós","Au revoir","Arrivederci"],["Thank you","Danke","Teşekkür ederim","Gracias","Merci","Grazie"],["Please","Bitte","Lütfen","Por favor","S’il vous plaît","Per favore"],["My name is Alex","Ich heiße Alex","Benim adım Alex","Me llamo Alex","Je m’appelle Alex","Mi chiamo Alex"],["What is your name?","Wie heißt du?","Adın ne?","¿Cómo te llamas?","Comment tu t’appelles ?","Come ti chiami?"],["Nice to meet you","Schön, dich kennenzulernen","Tanıştığımıza memnun oldum","Mucho gusto","Enchanté","Piacere"],["I am from Germany","Ich komme aus Deutschland","Almanya’dan geliyorum","Soy de Alemania","Je viens d’Allemagne","Vengo dalla Germania"],["I live in Dortmund","Ich wohne in Dortmund","Dortmund’da yaşıyorum","Vivo en Dortmund","J’habite à Dortmund","Vivo a Dortmund"],["And you?","Und du?","Ya sen?","¿Y tú?","Et toi ?","E tu?"],["I do not understand","Ich verstehe nicht","Anlamıyorum","No entiendo","Je ne comprends pas","Non capisco"],["Please speak slowly","Bitte sprechen Sie langsam","Lütfen yavaş konuşun","Hable despacio, por favor","Parlez lentement, s’il vous plaît","Parli lentamente, per favore"],["Can you repeat that?","Können Sie das wiederholen?","Tekrar eder misiniz?","¿Puede repetirlo?","Pouvez-vous répéter ?","Può ripetere?"],["What does that mean?","Was bedeutet das?","Bu ne demek?","¿Qué significa eso?","Qu’est-ce que cela veut dire ?","Che cosa significa?"],["I am learning","Ich lerne","Öğreniyorum","Estoy aprendiendo","J’apprends","Sto imparando"],["I have a question","Ich habe eine Frage","Bir sorum var","Tengo una pregunta","J’ai une question","Ho una domanda"],["I would like water","Ich hätte gern Wasser","Su istiyorum","Quisiera agua","Je voudrais de l’eau","Vorrei dell’acqua"],["A coffee, please","Einen Kaffee, bitte","Bir kahve, lütfen","Un café, por favor","Un café, s’il vous plaît","Un caffè, per favore"],["The menu, please","Die Speisekarte, bitte","Menü, lütfen","La carta, por favor","La carte, s’il vous plaît","Il menù, per favore"],["Without sugar","Ohne Zucker","Şekersiz","Sin azúcar","Sans sucre","Senza zucchero"],["The bill, please","Die Rechnung, bitte","Hesap, lütfen","La cuenta, por favor","L’addition, s’il vous plaît","Il conto, per favore"],["It is delicious","Es ist lecker","Çok lezzetli","Está delicioso","C’est délicieux","È delizioso"],["Where is the station?","Wo ist der Bahnhof?","Tren istasyonu nerede?","¿Dónde está la estación?","Où est la gare ?","Dov’è la stazione?"],["To the left","Nach links","Sola","A la izquierda","À gauche","A sinistra"],["To the right","Nach rechts","Sağa","A la derecha","À droite","A destra"],["Straight ahead","Geradeaus","Düz ileride","Todo recto","Tout droit","Sempre dritto"],["Is it far?","Ist es weit?","Uzak mı?","¿Está lejos?","Est-ce loin ?","È lontano?"],["I am looking for this address","Ich suche diese Adresse","Bu adresi arıyorum","Busco esta dirección","Je cherche cette adresse","Cerco questo indirizzo"],["How much does it cost?","Wie viel kostet das?","Bu ne kadar?","¿Cuánto cuesta?","Combien ça coûte ?","Quanto costa?"],["Can I pay by card?","Kann ich mit Karte bezahlen?","Kartla ödeyebilir miyim?","¿Puedo pagar con tarjeta?","Puis-je payer par carte ?","Posso pagare con la carta?"],["I need a bag","Ich brauche eine Tasche","Bir çantaya ihtiyacım var","Necesito una bolsa","J’ai besoin d’un sac","Ho bisogno di una borsa"],["I am just looking","Ich schaue nur","Sadece bakıyorum","Solo estoy mirando","Je regarde seulement","Sto solo guardando"],["That is too expensive","Das ist zu teuer","Bu çok pahalı","Es demasiado caro","C’est trop cher","È troppo caro"],["I will take this","Ich nehme das","Bunu alacağım","Me llevo esto","Je prends ceci","Prendo questo"],["What time is it?","Wie spät ist es?","Saat kaç?","¿Qué hora es?","Quelle heure est-il ?","Che ore sono?"],["Today","Heute","Bugün","Hoy","Aujourd’hui","Oggi"],["Tomorrow","Morgen","Yarın","Mañana","Demain","Domani"],["I have time tomorrow","Ich habe morgen Zeit","Yarın vaktim var","Tengo tiempo mañana","J’ai du temps demain","Ho tempo domani"],["Shall we meet here?","Treffen wir uns hier?","Burada buluşalım mı?","¿Quedamos aquí?","On se retrouve ici ?","Ci incontriamo qui?"],["See you tomorrow","Bis morgen","Yarın görüşürüz","Hasta mañana","À demain","A domani"],["I need help","Ich brauche Hilfe","Yardıma ihtiyacım var","Necesito ayuda","J’ai besoin d’aide","Ho bisogno di aiuto"],["Where is the pharmacy?","Wo ist die Apotheke?","Eczane nerede?","¿Dónde está la farmacia?","Où est la pharmacie ?","Dov’è la farmacia?"],["I do not feel well","Mir geht es nicht gut","Kendimi iyi hissetmiyorum","No me encuentro bien","Je ne me sens pas bien","Non mi sento bene"],["I have lost my phone","Ich habe mein Handy verloren","Telefonumu kaybettim","He perdido mi teléfono","J’ai perdu mon téléphone","Ho perso il telefono"],["Can you help me?","Können Sie mir helfen?","Bana yardım eder misiniz?","¿Puede ayudarme?","Pouvez-vous m’aider ?","Può aiutarmi?"],["Please write it down","Bitte schreiben Sie es auf","Lütfen yazın","Escríbalo, por favor","Écrivez-le, s’il vous plaît","Lo scriva, per favore"]];
const LANG=['English','German','Turkish','Spanish','French','Italian'],CODES=['en','de','tr','es','fr','it'];
const UNITS=['First connections','Meet someone','Keep talking','At the café','Find your way','Everyday errands','Make plans','Ask for help'];
const TASKS=['Greet someone arriving in the morning. Thank them and say goodbye.','Introduce yourself with your real name and city. Ask the other person their name.','Imagine you missed what someone said. Ask them to repeat it slowly.','Order a coffee and water. Ask for the bill.','Ask where the station is. Give directions left, right, then straight ahead.','Ask the price of something and whether you can pay by card.','Invite someone to meet here tomorrow. Say goodbye until tomorrow.','Explain that you lost your phone and ask someone for help.'];
const NOTES=[
'Practise greetings in the morning and evening. A phrase can have more than one natural translation.',
'Replace Alex and Dortmund with your own details. Some introductions here use informal “you”.',
'These requests use polite forms where the language distinguishes them. Repeat the whole phrase before changing words.',
'Learn requests as useful chunks. Then change the drink or food. Words and articles may need to change together.',
'Combine the location question with a direction. Point as you speak to connect meaning with movement.',
'Practise the full exchange: ask the price, respond, and ask about payment.',
'Combine a time word with a sentence. In German, “morgen” is tomorrow, while “Morgen” is a noun meaning morning.',
'Practise asking for help clearly. These are language exercises, not emergency instructions.'
];
const KEY='lingua-local-v1'; let db={version:1,active:null,profiles:[]},p=null,view='home',draft=null,step=0,session=null;
const app=document.querySelector('#app'),status=document.querySelector('#status');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
function notify(s){status.textContent=s}
function valid(x){return x&&x.version===1&&Array.isArray(x.profiles)&&x.profiles.length<=30&&x.profiles.every(q=>typeof q.id==='string'&&typeof q.name==='string'&&q.name.length<=60&&Array.isArray(q.targets)&&q.targets.length>0&&q.targets.every(t=>Number.isInteger(t)&&t>=0&&t<6)&&q.targets.includes(q.target)&&Number.isInteger(q.source)&&q.source>=0&&q.source<6&&q.targets.every(t=>t!==q.source)&&[15,30,45,60].includes(q.minutes)&&['both','speak'].includes(q.mode)&&q.cards&&typeof q.cards==='object'&&!Array.isArray(q.cards)&&Object.values(q.cards).every(c=>c&&Number.isFinite(c.due)&&Number.isInteger(c.level)&&c.level>=0&&c.level<=5)&&q.days&&typeof q.days==='object'&&Object.values(q.days).every(n=>Number.isFinite(n)&&n>=0)&&Array.isArray(q.known)&&q.known.every(k=>k&&typeof k.language==='string'&&typeof k.level==='string'&&typeof k.write==='boolean'))}
try{let raw=localStorage.getItem(KEY);if(raw){let x=JSON.parse(raw);if(valid(x))db=x;else notify('Saved data could not be read. Import a backup in Settings or create a new profile.')}}catch(e){notify('Device storage is unavailable. Export a backup before closing.')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){notify('Progress is only in memory: browser storage is unavailable or full. Export a backup in Settings.')}} 
p=db.profiles.find(q=>q.id===db.active)||null;
function options(selected){return LANG.map((s,i)=>'<option value="'+i+'" '+(i===selected?'selected':'')+'>'+s+'</option>').join('')}
function button(text,action,cls=''){return '<button class="'+cls+'" data-action="'+action+'">'+text+'</button>'}
function go(v){if(window.speechSynthesis)speechSynthesis.cancel();view=v;render();window.scrollTo(0,0)}
function newProfile(){draft={name:'',known:[{language:'English',level:'Native',write:true}],source:0,targets:[1],target:1,minutes:15,mode:'both'};step=0;view='setup';render()}
function setup(){let body='';if(step===0)body='<h1>Make yourself at home.</h1><p class="muted">A calm place to practise a little every day. No account, no ads, no pressure.</p><label>Your first name or nickname<input id="name" maxlength="60" value="'+esc(draft.name)+'" placeholder="What should we call you?"></label><fieldset><legend>Languages you already speak</legend>'+draft.known.map((k,i)=>'<div class="card"><label>Language<input data-known="'+i+'" data-field="language" value="'+esc(k.language)+'" maxlength="60"></label><label>Speaking level<select data-known="'+i+'" data-field="level">'+['A1','A2','B1','B2','C1','C2','Native'].map(l=>'<option '+(k.level===l?'selected':'')+'>'+l+'</option>').join('')+'</select></label><label><input type="checkbox" data-known="'+i+'" data-field="write" '+(k.write?'checked':'')+'>I can write in this language</label></div>').join('')+button('+ Add another language','addKnown')+'</fieldset>';
if(step===1)body='<h1>Where would you like to go?</h1><label>Translate exercises from<select id="source">'+options(draft.source)+'</select></label><p class="muted">Choose a language you understand. Navigation and teaching notes are in English.</p><fieldset><legend>Languages you want to learn</legend>'+LANG.map((l,i)=>'<label><input data-target="'+i+'" type="checkbox" '+(draft.targets.includes(i)?'checked':'')+' '+(i===draft.source?'disabled':'')+'>'+l+'</label>').join('')+'</fieldset><p>Each course includes 8 beginner units and 48 expressions. Intermediate speakers can use it as a refresher. Advanced courses are not included.</p>';
if(step===2)body='<h1>A pace you can keep.</h1><fieldset><legend>Daily time across all your languages</legend>'+[[15,'Gentle · 15 minutes'],[30,'Steady · 30 minutes'],[45,'Focused · 45 minutes'],[60,'Intensive · 60 minutes']].map(([n,l])=>'<label><input type="radio" name="minutes" value="'+n+'" '+(draft.minutes===n?'checked':'')+'>'+l+'</label>').join('')+'</fieldset><p class="muted">15 minutes is the minimum plan. Take breaks whenever you need them. More practice can help, but no schedule guarantees fluency.</p><fieldset><legend>What would you like to practise?</legend><label><input type="radio" name="mode" value="both" '+(draft.mode==='both'?'checked':'')+'>Speaking and writing</label><label><input type="radio" name="mode" value="speak" '+(draft.mode==='speak'?'checked':'')+'>Speaking only · no typing exercises</label></fieldset>';
app.innerHTML='<section class="narrow"><div class="row spread"><span class="eyebrow">Your learning profile</span><span>Step '+(step+1)+' of 3</span></div><progress max="3" value="'+(step+1)+'"></progress>'+body+'<div class="row">'+(step?button('Back','back'):'')+button(step===2?'Create my plan →':'Continue →','next','primary')+(db.profiles.length?button('Cancel','cancelSetup'):'')+'</div></section>'}
function collect(){if(step===0){draft.name=document.querySelector('#name').value.trim();document.querySelectorAll('[data-known]').forEach(el=>draft.known[+el.dataset.known][el.dataset.field]=el.type==='checkbox'?el.checked:el.value.trim())}if(step===1){draft.source=+document.querySelector('#source').value;draft.targets=[...document.querySelectorAll('[data-target]:checked')].map(e=>+e.dataset.target).filter(t=>t!==draft.source)}if(step===2){draft.minutes=+document.querySelector('[name=minutes]:checked').value;draft.mode=document.querySelector('[name=mode]:checked').value}}
function key(id){return p.target+':'+id}
function due(){return DATA.map((_,i)=>i).filter(i=>p.cards[key(i)]&&p.cards[key(i)].due<=Date.now())}
function learned(){return DATA.filter((_,i)=>p.cards[key(i)]).length}
function mastered(){return DATA.filter((_,i)=>(p.cards[key(i)]?.level||0)>=3).length}
function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===view));if(view==='setup')return setup();if(!p){if(view==='settings')return settings();return newProfile()}if(view==='lesson')return lesson();if(view==='library')return library();if(view==='plan')return plan();if(view==='settings')return settings();home()}
function picker(){return '<label>Current course<select id="course">'+p.targets.map(t=>'<option value="'+t+'" '+(t===p.target?'selected':'')+'>'+LANG[t]+'</option>').join('')+'</select></label>'}
function home(){let count=learned(),n=due().length;app.innerHTML='<div class="row spread"><span class="eyebrow">Your daily language space</span><span class="pill">Local learning · no account</span></div><h1>A little today.<br>A little more tomorrow.</h1><p class="muted">Welcome back, '+esc(p.name)+'. Pick up exactly where you left off.</p><div class="grid"><section class="hero">'+picker()+'<h2>'+(p.session?'Your practice is waiting.':n?'Keep what you have learned.':'Let’s build your next conversation.')+'</h2><p>'+n+' expressions ready for review. '+count+' of 48 introduced.</p>'+button(p.session?'Resume practice →':'Start daily practice →','daily','primary')+'<p><small>Recall first. Check your answer. Try again without pressure.</small></p></section><aside class="card"><span class="eyebrow">Today’s rhythm</span><div class="big">'+Math.floor((p.days[day()]||0)/60)+' / '+p.minutes+' min</div><progress max="'+p.minutes*60+'" value="'+Math.min(p.minutes*60,p.days[day()]||0)+'"></progress><p>Active practice time, saved on this browser.</p><div class="row"><span class="pill">'+mastered()+' expressions strengthening</span><span class="pill">'+Object.keys(p.days).length+' practice days</span></div></aside></div><h2>Your learning path</h2><div class="grid">'+UNITS.map((u,i)=>'<div class="card unit"><span class="number">'+String(i+1).padStart(2,'0')+'</span><div><b>'+u+'</b><small>'+DATA.slice(i*6,i*6+6).filter((_,j)=>p.cards[key(i*6+j)]).length+' / 6 introduced</small></div><button data-unit="'+i+'" aria-label="Practise '+u+'">→</button></div>').join('')+'</div>'}
function start(ids){session={ids:ids.slice(0,12),pos:0,stage:'study',revealed:false};p.session=session;save();go('lesson')}
function daily(){if(p.session){session=p.session;go('lesson');return}let review=due().slice(0,8),fresh=DATA.map((_,i)=>i).filter(i=>!p.cards[key(i)]).slice(0,Math.max(2,Math.floor(p.minutes/5)));let ids=[...new Set([...review,...fresh])];if(!ids.length)ids=DATA.map((_,i)=>i).sort((a,b)=>(p.cards[key(a)]?.due||0)-(p.cards[key(b)]?.due||0)).slice(0,6);start(ids)}
function lesson(){session=p.session;if(!session||!Array.isArray(session.ids)||!session.ids.length){go('home');return}let id=session.ids[session.pos],r=DATA[id];if(!r){p.session=null;save();go('home');return}let u=Math.floor(id/6),target=r[p.target],source=r[p.source],stage=session.stage;
app.innerHTML='<section class="lesson"><div class="row spread">'+button('← Pause & save','pause')+'<span>'+LANG[p.target]+' · '+(session.pos+1)+' / '+session.ids.length+'</span></div><progress value="'+session.pos+'" max="'+session.ids.length+'"></progress><div class="card stack"><span class="eyebrow">'+UNITS[u]+' · '+(stage==='study'?'Learn the expression':'Retrieve from memory')+'</span>'+(stage==='study'?'<div class="phrase" lang="'+CODES[p.target]+'">'+esc(target)+'</div><p lang="'+CODES[p.source]+'">'+esc(source)+'</p>'+button('Listen · device voice','listen')+'<p class="muted">'+NOTES[u]+'</p><p>Say it slowly, then naturally. Picture using it in a real conversation.</p>'+button('Ready to recall →','recall','primary'):'<p>How would you say this in '+LANG[p.target]+'?</p><div class="phrase" lang="'+CODES[p.source]+'">'+esc(source)+'</div>'+(p.mode==='both'?'<form id="answerForm"><label>Your answer<input id="answer" lang="'+CODES[p.target]+'" autocomplete="off" autocapitalize="off" spellcheck="false"></label><button class="primary" type="submit">Check answer</button></form>':'<p>Say your answer aloud before revealing it. Speaking is self-assessed; no microphone is used.</p>')+button('Reveal & compare','reveal')+'<div id="feedback" role="status"></div><div id="rating" class="hidden"><p>Compare with: <strong lang="'+CODES[p.target]+'">'+esc(target)+'</strong></p>'+button('Listen · device voice','listen')+'<p>How did recall feel? This sets the next review.</p><div class="row">'+button('Again','rate0')+button('With effort','rate1')+button('Comfortable','rate2','primary')+'</div></div>')+'</div><details><summary>Use it in a conversation</summary><p>'+TASKS[u]+'</p></details></section>';
if(stage==='recall'){document.querySelector('#answerForm')?.addEventListener('submit',e=>{e.preventDefault();let val=document.querySelector('#answer').value.trim();if(!val){notify('Try an answer, or use Reveal & compare.');return}let exact=normalize(val)===normalize(target);reveal(exact?'Matches the model. Now rate your recall.':'Compare with the model below. Other natural answers may also be valid.');});if(session.revealed)reveal('Model answer revealed. Recall is self-assessed.')}
}
function normalize(s){return s.normalize('NFC').toLocaleLowerCase(CODES[p.target]).replace(/[.,!?¿¡’'\u201c\u201d"]/g,'').replace(/\s+/g,' ').trim()}
function reveal(msg='Compare your answer, then rate your recall.'){session.revealed=true;document.querySelector('#rating').classList.remove('hidden');document.querySelector('#feedback').className='success';document.querySelector('#feedback').textContent=msg;save()}
function rate(n){if(!session.revealed)return;let id=session.ids[session.pos],old=p.cards[key(id)]||{level:0,due:0};let level=n===0?0:Math.min(5,old.level+(n===2?1:0));let delay=n===0?60000:n===1?86400000:[1,1,3,7,14,30][level]*86400000;p.cards[key(id)]={level,due:Date.now()+delay};if(n===0&&session.ids.length<18)session.ids.push(id);session.pos++;session.stage='study';session.revealed=false;if(session.pos>=session.ids.length){p.session=null;save();view='complete';app.innerHTML='<section class="narrow hero"><span class="eyebrow">Practice complete</span><h1>That’s a step forward.</h1><p>Your progress is saved. Difficult expressions return sooner; comfortable ones get more space.</p><h2>One minute to make it yours</h2><p>'+TASKS[Math.floor(id/6)]+'</p><p>Try without looking, then check the expressions in your library.</p>'+button('Back to today','home','primary')+'</section>';return}save();lesson()}
function speak(){let id=p.session?.ids[p.session.pos];if(id===undefined)return;if(!window.speechSynthesis){notify('Device speech is unavailable. Read and practise aloud instead.');return}let voice=speechSynthesis.getVoices().find(v=>v.localService&&v.lang.toLowerCase().startsWith(CODES[p.target]));if(!voice){notify('No installed offline '+LANG[p.target]+' voice is available. Add one in your device settings. Text practice works without it.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(DATA[id][p.target]);u.voice=voice;u.lang=voice.lang;u.rate=.85;speechSynthesis.speak(u)}
function library(){app.innerHTML='<span class="eyebrow">Your pocket phrasebook</span><h1>Useful words. Real situations.</h1>'+picker()+'<label>Find an expression<input id="search" type="search" placeholder="Search either language"></label><div id="results"></div>';filterLibrary('')}
function filterLibrary(term){document.querySelector('#results').innerHTML=UNITS.map((u,j)=>{let rows=DATA.map((r,i)=>({r,i})).filter(({r,i})=>Math.floor(i/6)===j&&(r[p.source]+' '+r[p.target]).toLocaleLowerCase().includes(term.toLocaleLowerCase()));return rows.length?'<section class="card"><h2>'+u+'</h2><p class="muted">'+NOTES[j]+'</p>'+rows.map(({r})=>'<p><strong lang="'+CODES[p.target]+'">'+esc(r[p.target])+'</strong><br><span lang="'+CODES[p.source]+'">'+esc(r[p.source])+'</span></p>').join('')+'<button data-unit="'+j+'">Practise this unit</button></section>':''}).join('')||'<p>No expressions found. Try a shorter search.</p>'}
function plan(){let per=Math.round(p.minutes/p.targets.length);app.innerHTML='<span class="eyebrow">A routine, made for you</span><h1>Your next small steps.</h1><div class="hero"><h2>'+p.minutes+' minutes a day · '+(p.mode==='both'?'speak and write':'speak')+'</h2><p>Learning '+p.targets.map(t=>LANG[t]).join(', ')+'. About '+per+' minutes per language if you divide time evenly. You can also alternate languages each day.</p><div class="grid"><div><h3>1 · Remember</h3><p>Spend about '+Math.round(p.minutes*.3)+' minutes recalling due expressions before looking.</p></div><div><h3>2 · Build</h3><p>Spend about '+Math.round(p.minutes*.4)+' minutes on new phrases, meaning, and '+(p.mode==='both'?'writing':'speaking')+'.</p></div><div><h3>3 · Use</h3><p>Spend the remaining time combining phrases in the conversation prompts.</p></div></div></div><h2>What this course can do</h2><p>Build a foundation for greetings, introductions, clarification, cafés, directions, errands, plans, and asking for help. Repeat units with your own details and practise recalling them on different days.</p><h2>What comes after</h2><p>Fluency requires a much larger vocabulary, grammar, listening variety, and spontaneous interaction. This 48-expression starter course does not provide a complete route to fluency or certify a CEFR level. Your saved speaking levels are self-reported, not placement-test results.</p><p>Do not rush to finish the cards. Being able to use expressions later matters more than completing a screen.</p>'+button('Start today’s practice','daily','primary')}
function download(name,content,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function settings(){app.innerHTML='<section class="narrow"><span class="eyebrow">Your space</span><h1>Keep learning comfortable.</h1><div class="card"><h2>Profiles on this device</h2>'+db.profiles.map(q=>'<p><button data-profile="'+esc(q.id)+'">'+esc(q.name)+(q===p?' · active':'')+'</button></p>').join('')+button('Add a learner','new')+'</div>'+(p?'<div class="card"><h2>Practice preferences</h2><label>Daily commitment<select id="setMinutes">'+[15,30,45,60].map(n=>'<option '+(n===p.minutes?'selected':'')+' value="'+n+'">'+n+' minutes</option>').join('')+'</select></label><label>Learning mode<select id="setMode"><option value="both" '+(p.mode==='both'?'selected':'')+'>Speaking and writing</option><option value="speak" '+(p.mode==='speak'?'selected':'')+'>Speaking only</option></select></label></div>':'')+'<div class="card"><h2>Offline & backups</h2><p>All lessons are bundled. No analytics, remote fonts, AI service, or cloud speech. Progress belongs to this browser and can be lost if browser data is cleared.</p><p>You can download this page and open it without an internet connection. Device speech requires an installed local voice. Progress storage for downloaded files varies by browser; keep backups.</p><div class="row">'+button('Export progress backup','export')+button('Download offline page','download')+'</div><label>Restore a JSON backup<input id="import" type="file" accept=".json,application/json"></label><p>Import adds profiles as separate copies, keeping your existing learners.</p><p id="offlineState">Downloaded HTML works offline immediately. Hosted offline caching is checked when the page opens.</p></div></section>';document.querySelector('#import').addEventListener('change',async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>2000000)throw Error('Backup is too large.');let x=JSON.parse(await f.text());if(!valid(x))throw Error('This is not a valid Lingua Local backup.');if(db.profiles.length+x.profiles.length>30)throw Error('At most 30 profiles are supported.');x.profiles.forEach(q=>{q.id=uid();q.session=null;db.profiles.push(q)});save();notify('Backup restored as additional profiles. Select one to continue.');settings()}catch(err){notify('Import failed: '+err.message)}})}
function uid(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
app.addEventListener('input',e=>{if(e.target.id==='search')filterLibrary(e.target.value)});
app.addEventListener('change',e=>{if(e.target.id==='source'){collect();draft.targets=draft.targets.filter(t=>t!==draft.source);setup()}if(e.target.id==='course'){p.target=+e.target.value;p.session=null;save();render()}if(e.target.id==='setMinutes'){p.minutes=+e.target.value;save()}if(e.target.id==='setMode'){p.mode=e.target.value;p.session=null;save()}});
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.nav){go(b.dataset.nav);return}if(b.dataset.profile){p=db.profiles.find(q=>q.id===b.dataset.profile);db.active=p.id;save();go('home');return}if(b.dataset.unit!==undefined){start(Array.from({length:6},(_,i)=>+b.dataset.unit*6+i));return}let a=b.dataset.action;if(!a)return;if(a==='new'){newProfile();return}if(a==='addKnown'){collect();if(draft.known.length<12)draft.known.push({language:'',level:'A1',write:false});setup();return}if(a==='back'){collect();step--;setup();return}if(a==='cancelSetup'){go('home');return}if(a==='next'){collect();if(step===0&&(!draft.name||draft.known.some(k=>!k.language))){notify('Please enter a nickname and the languages you speak.');return}if(step===1&&!draft.targets.length){notify('Choose at least one different language to learn.');return}notify('');if(step<2){step++;setup()}else{if(db.profiles.length>=30){notify('Maximum 30 profiles.');return}p={...draft,id:uid(),target:draft.targets[0],cards:{},days:{},session:null};db.profiles.push(p);db.active=p.id;save();go('plan')}return}if(a==='daily')daily();if(a==='pause'||a==='home')go('home');if(a==='recall'){session.stage='recall';session.revealed=false;save();lesson()}if(a==='reveal')reveal();if(a?.startsWith('rate'))rate(+a.slice(4));if(a==='listen')speak();if(a==='export')download('lingua-local-progress.json',JSON.stringify(db,null,2),'application/json');if(a==='download'){let clone=document.documentElement.cloneNode(true);clone.querySelector('#app').innerHTML='';clone.querySelector('#status').textContent='';download('lingua-local.html','<!doctype html>\n'+clone.outerHTML,'text/html')}});
let lastTick=Date.now();setInterval(()=>{let now=Date.now(),elapsed=Math.min(15,(now-lastTick)/1000);lastTick=now;if(p&&view==='lesson'&&!document.hidden){p.days[day()]=(p.days[day()]||0)+elapsed;save()}},10000);
window.addEventListener('pagehide',save);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>notify('Offline lesson cache ready. Progress is saved on this device.')).catch(()=>notify('Offline cache unavailable. Use Settings → Download offline page.'));
render();
</script></body></html>
