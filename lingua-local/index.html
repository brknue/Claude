if(step===2)body='<h1>A pace you can keep.</h1><fieldset><legend>Daily time across all your languages</legend>'+[[15,'Gentle · 15 minutes'],[30,'Steady · 30 minutes'],[45,'Focused · 45 minutes'],[60,'Intensive · 60 minutes']].map(([n,l])=>'<label><input type="radio" name="minutes" value="'+n+'" '+(draft.minutes===n?'checked':'')+'>'+l+'</label>').join('')+'</fieldset><p class="muted">15 minutes is the minimum plan. Take breaks whenever you need them. More practice can help, but no schedule guarantees fluency.</p><fieldset><legend>What would you like to practise?</legend><label><input type="radio" name="mode" value="both" '+(draft.mode==='both'?'checked':'')+'>Speaking and writing</label><label><input type="radio" name="mode" value="speak" '+(draft.mode==='speak'?'checked':'')+'>Speaking only · no typing exercises</label></fieldset>';
app.innerHTML='<section class="narrow"><div class="row spread"><span class="eyebrow">Your learning profile</span><span>Step '+(step+1)+' of 3</span></div><progress max="3" value="'+(step+1)+'"></progress>'+body+'<div class="row">'+(step?button('Back','back'):'')+button(step===2?'Create my plan →':'Continue →','next','primary')+(db.profiles.length?button('Cancel','cancelSetup'):'')+'</div></section>'}
function collect(){if(step===0){draft.name=document.querySelector('#name').value.trim();document.querySelectorAll('[data-known]').forEach(el=>draft.known[+el.dataset.known][el.dataset.field]=el.type==='checkbox'?el.checked:el.value.trim())}if(step===1){draft.source=+document.querySelector('#source').value;draft.targets=[...document.querySelectorAll('[data-target]:checked')].map(e=>+e.dataset.target).filter(t=>t!==draft.source)}if(step===2){draft.minutes=+document.querySelector('[name=minutes]:checked').value;draft.mode=document.querySelector('[name=mode]:checked').value}}
function key(id){return p.target+':'+id}
function due(){return DATA.map((_,i)=>i).filter(i=>p.cards[key(i)]&&p.cards[key(i)].due<=Date.now())}
function learned(){return DATA.filter((_,i)=>p.cards[key(i)]).length}
function mastered(){return DATA.filter((_,i)=>(p.cards[key(i)]?.level||0)>=3).length}
function render(){document.querySelectorAll('[data-nav]').forEach(b=>{b.classList.toggle('active',b.dataset.nav===view);if(b.dataset.nav===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(view==='setup')return setup();if(view==='sources')return sources();if(!p){if(view==='settings')return settings();return newProfile()}if(view==='lesson')return lesson();if(view==='library')return library();if(view==='sources')return sources();if(view==='plan')return plan();if(view==='settings')return settings();home()}
function picker(){return '<label>Current course<select id="course">'+p.targets.map(t=>'<option value="'+t+'" '+(t===p.target?'selected':'')+'>'+LANG[t]+'</option>').join('')+'</select></label>'}
function packCards(from,to){return UNITS.slice(from,to).map((u,j)=>{const i=from+j;return '<div class="card unit"><span class="number">'+String(i+1).padStart(2,'0')+'</span><div><b>'+u+'</b><small>'+UNIT_IDS[i].filter(id=>p.cards[key(id)]).length+' / '+UNIT_IDS[i].length+' introduced</small></div><button data-unit="'+i+'" aria-label="Practise '+u+'">→</button></div>'}).join('')}
function home(){let count=learned(),n=due().length;app.innerHTML='<div class="row spread"><span class="eyebrow">Your daily language space</span><span class="pill">Local learning · no account</span></div><h1>A little today.<br>A little more tomorrow.</h1><p class="muted">Welcome back, '+esc(p.name)+'. Pick up exactly where you left off.</p><div class="grid"><section class="hero">'+picker()+'<h2>'+(p.session?'Your practice is waiting.':n?'Keep what you have learned.':'Let’s build your next conversation.')+'</h2><p>'+n+' expressions ready for review. '+count+' of '+DATA.length+' introduced.</p>'+button(p.session?'Resume practice →':'Start daily practice →','daily','primary')+'<p><small>Recall first. Check your answer. Try again without pressure.</small></p></section><aside class="card"><span class="eyebrow">Today’s rhythm</span><div class="big">'+Math.floor((p.days[day()]||0)/60)+' / '+p.minutes+' min</div><progress max="'+p.minutes*60+'" value="'+Math.min(p.minutes*60,p.days[day()]||0)+'"></progress><p>Active practice time, saved on this browser.</p><div class="row"><span class="pill">'+mastered()+' expressions strengthening</span><span class="pill">'+Object.keys(p.days).length+' practice day'+(Object.keys(p.days).length===1?'':'s')+'</span></div></aside></div><h2>Your learning path</h2><div class="grid">'+packCards(0,8)+'</div><details><summary>Explore 23 core vocabulary packs</summary><p class="muted">People, nature, actions and everyday descriptions. Open a pack when you want to learn more.</p><div class="grid">'+packCards(8,UNITS.length)+'</div></details>'}
function start(ids){session={ids:ids.slice(0,12),pos:0,stage:'study',revealed:false};p.session=session;save();go('lesson')}
function daily(){if(p.session){session=p.session;go('lesson');return}let review=due().slice(0,8),fresh=DATA.map((_,i)=>i).filter(i=>!p.cards[key(i)]).slice(0,Math.max(2,Math.floor(p.minutes/5)));let ids=[...new Set([...review,...fresh])];if(!ids.length)ids=DATA.map((_,i)=>i).sort((a,b)=>(p.cards[key(a)]?.due||0)-(p.cards[key(b)]?.due||0)).slice(0,6);start(ids)}
function lesson(){session=p.session;if(!session||!Array.isArray(session.ids)||!session.ids.length){go('home');return}let id=session.ids[session.pos],r=DATA[id];if(!r){p.session=null;save();go('home');return}let u=unitOf(id),target=r[p.target],source=r[p.source],stage=session.stage;
app.innerHTML='<section class="lesson"><div class="row spread">'+button('← Pause & save','pause')+'<span>'+LANG[p.target]+' · '+(session.pos+1)+' / '+session.ids.length+'</span></div><progress value="'+session.pos+'" max="'+session.ids.length+'"></progress><div class="card stack"><span class="eyebrow">'+UNITS[u]+' · '+(stage==='study'?'Learn the expression':'Retrieve from memory')+'</span>'+(stage==='study'?'<div class="phrase" lang="'+CODES[p.target]+'">'+esc(target)+'</div>'+(ipaFor(id)?'<p class="muted">Pronunciation: '+esc(ipaFor(id))+'</p>':'')+'<p lang="'+CODES[p.source]+'">'+esc(source)+'</p>'+button('Listen · device voice','listen')+'<p class="muted">'+NOTES[u]+'</p><p>Say it slowly, then naturally. Picture using it in a real conversation.</p>'+button('Ready to recall →','recall','primary'):'<p>How would you say this in '+LANG[p.target]+'?</p><div class="phrase" lang="'+CODES[p.source]+'">'+esc(source)+'</div>'+(p.mode==='both'?'<form id="answerForm"><label>Your answer<input id="answer" lang="'+CODES[p.target]+'" autocomplete="off" autocapitalize="off" spellcheck="false"></label><button class="primary" type="submit">Check answer</button></form>':'<p>Say your answer aloud before revealing it. Speaking is self-assessed; no microphone is used.</p>')+button('Reveal & compare','reveal')+'<div id="feedback" role="status"></div><div id="rating" class="hidden"><p>Compare with: <strong lang="'+CODES[p.target]+'">'+esc(target)+'</strong></p>'+button('Listen · device voice','listen')+'<p>How did recall feel? This sets the next review.</p><div class="row">'+button('Again','rate0')+button('With effort','rate1')+button('Comfortable','rate2','primary')+'</div></div>')+'</div><details><summary>Use it in a conversation</summary><p>'+TASKS[u]+'</p></details></section>';
if(stage==='recall'){document.querySelector('#answerForm')?.addEventListener('submit',e=>{e.preventDefault();let val=document.querySelector('#answer').value.trim();if(!val){notify('Try an answer, or use Reveal & compare.');return}let exact=answerMatches(val,target,id);reveal(exact?'Matches the model. Now rate your recall.':'Compare with the model below. Other natural answers may also be valid.');});if(session.revealed)reveal('Model answer revealed. Recall is self-assessed.')}
}
function normalize(s){return s.normalize('NFC').toLocaleLowerCase(CODES[p.target]).replace(/[.,!?¿¡’'\u201c\u201d"]/g,'').replace(/\s+/g,' ').trim()}
function reveal(msg='Compare your answer, then rate your recall.'){session.revealed=true;document.querySelector('#rating').classList.remove('hidden');document.querySelector('#feedback').className='success';document.querySelector('#feedback').textContent=msg;save()}
function rate(n){if(!session.revealed)return;let id=session.ids[session.pos],old=p.cards[key(id)]||{level:0,due:0};let level=n===0?0:Math.min(5,old.level+(n===2?1:0));let delay=n===0?60000:n===1?86400000:[1,1,3,7,14,30][level]*86400000;p.cards[key(id)]={level,due:Date.now()+delay};if(n===0&&session.ids.length<18)session.ids.push(id);session.pos++;session.stage='study';session.revealed=false;if(session.pos>=session.ids.length){p.session=null;save();view='complete';app.innerHTML='<section class="narrow hero"><span class="eyebrow">Practice complete</span><h1>That’s a step forward.</h1><p>Your progress is saved. Difficult expressions return sooner; comfortable ones get more space.</p><h2>One minute to make it yours</h2><p>'+TASKS[unitOf(id)]+'</p><p>Try without looking, then check the expressions in your library.</p>'+button('Back to today','home','primary')+'</section>';return}save();lesson()}
function speak(){let id=p.session?.ids[p.session.pos];if(id===undefined)return;if(!window.speechSynthesis){notify('Device speech is unavailable. Read and practise aloud instead.');return}let voice=speechSynthesis.getVoices().find(v=>v.localService&&v.lang.toLowerCase().startsWith(CODES[p.target]));if(!voice){notify('No installed offline '+LANG[p.target]+' voice is available. Add one in your device settings. Text practice works without it.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(id>=48?variants(DATA[id][p.target])[0]:DATA[id][p.target]);u.voice=voice;u.lang=voice.lang;u.rate=.85;speechSynthesis.speak(u)}

let libraryPage=0,libraryMatches=[],libraryState={term:'',collection:'all',topic:'all',page:0};
function library(){
 app.innerHTML='<span class="eyebrow">An expanded library, always with you</span><h1>Words for your next conversation.</h1><p>48 original expressions + 207 core-word entries per language. Your original lessons and saved progress are kept.</p>'+picker()+'<div class="grid"><label>Search either language<input id="search" type="search" placeholder="Try water, Wasser, family…"></label><label>Collection<select id="collection"><option value="all">All 255 entries</option><option value="phrases">Original expressions · 48</option><option value="words">Core vocabulary · 207</option><option value="due">Due for review</option></select></label><label>Topic<select id="topic"><option value="all">All topics</option>'+UNITS.map((u,i)=>'<option value="'+i+'">'+esc(u)+'</option>').join('')+'</select></label></div><div class="row spread"><p id="resultCount" role="status"></p><button data-action="clearFilters">Clear filters</button><button data-action="practiceFiltered" class="primary">Practise up to 12 results</button></div><div id="results" class="grid"></div><div id="pagination" class="row"></div><details><summary>About this collection & sources</summary><p>Core vocabulary comes from Wiktionary Swadesh lists, a cross-language core-word collection. It is not a CEFR curriculum. Alternatives retain context and may differ in formality or meaning. Pronunciation notation is available for many German and French entries.</p><p>Adapted from Wiktionary contributors via DCS77/swadesh-lists, under CC BY-SA 4.0. Selected modern forms and direction words were corrected; original imports and the change log are in the repository. No source site is contacted during study.</p>'+button('View sources & licenses','sources')+'</details>';
 document.querySelector('#search').value=libraryState.term;document.querySelector('#collection').value=libraryState.collection;document.querySelector('#topic').value=libraryState.topic;libraryPage=libraryState.page;filterLibrary(libraryState.term,true);
}
function filterLibrary(term,keepPage=false){
 if(!keepPage)libraryPage=0;
 let collection=document.querySelector('#collection').value,topic=document.querySelector('#topic').value;
 libraryState={term,collection,topic,page:libraryPage};const search=term.normalize('NFC').toLocaleLowerCase();
 libraryMatches=DATA.map((_,i)=>i).filter(i=>(collection==='all'||(collection==='phrases'&&i<48)||(collection==='words'&&i>=48)||(collection==='due'&&p.cards[key(i)]?.due<=Date.now()))&&(topic==='all'||UNIT_IDS[+topic].includes(i))&&(DATA[i][p.source]+' '+DATA[i][p.target]+' '+UNITS[unitOf(i)]).normalize('NFC').toLocaleLowerCase().includes(search));
 const pageCount=Math.max(1,Math.ceil(libraryMatches.length/24));libraryPage=Math.min(libraryPage,pageCount-1);libraryState.page=libraryPage;
 document.querySelector('#resultCount').textContent=libraryMatches.length+' entries · page '+(libraryPage+1)+' of '+pageCount;
 document.querySelector('[data-action=practiceFiltered]').disabled=!libraryMatches.length;
 document.querySelector('#results').innerHTML=libraryMatches.slice(libraryPage*24,(libraryPage+1)*24).map(i=>'<article class="card"><span class="eyebrow">'+esc(UNITS[unitOf(i)])+'</span><h2 lang="'+CODES[p.target]+'">'+esc(DATA[i][p.target])+'</h2><p lang="'+CODES[p.source]+'">'+esc(DATA[i][p.source])+'</p>'+(ipaFor(i)?'<p class="muted">'+esc(ipaFor(i))+'</p>':'')+'<div class="row"><button data-entry="'+i+'">Practise this</button><span class="pill">'+(i<48?'Original expression':'Core vocabulary')+'</span></div></article>').join('')||'<p>No matches. Try another word or clear the topic filter.</p>';
 document.querySelector('#pagination').innerHTML='<button data-action="prevLibrary" '+(libraryPage===0?'disabled':'')+'>← Previous</button><button data-action="nextLibrary" '+(libraryPage+1>=pageCount?'disabled':'')+'>Next →</button>';
}
function sources(){
 app.innerHTML='<section class="narrow"><span class="eyebrow">Offline copies · credited sources</span><h1>Where the words come from.</h1><p>The original 48 expressions per language are preserved. The additional 207 entries per language are an adaptation of Wiktionary core-word lists.</p><div class="card"><h2>Wiktionary contributors</h2><p>Collection: Swadesh lists. License: Creative Commons Attribution-ShareAlike 4.0 International (CC BY-SA 4.0). Adapted data is shared under the same license. No endorsement is implied.</p><p>Copied via DCS77/swadesh-lists, snapshot f72486ac841221b41f8e351d75bbab08f1b3d185. Changes: conversion to aligned offline JSON, themed grouping, selected everyday-language corrections, and removal of IPA where an entry was changed.</p><p>Source links below open only when you choose them; the lessons never require them.</p><ul>'+LANG.map(l=>'<li><a target="_blank" rel="noopener noreferrer" href="https://en.wiktionary.org/wiki/Appendix:'+l+'_Swadesh_list">'+l+' list</a> · <a target="_blank" rel="noopener noreferrer" href="https://en.wiktionary.org/w/index.php?title=Appendix:'+l+'_Swadesh_list&amp;action=history">Contributor history</a></li>').join('')+'</ul><p><a target="_blank" rel="noopener noreferrer" href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0 license</a> · <a target="_blank" rel="noopener noreferrer" href="https://github.com/DCS77/swadesh-lists">Source repository</a></p><p>Some dictionary forms have multiple senses, registers or grammatical uses. This vocabulary collection complements the expression lessons; it does not replace grammar or listening instruction.</p></div>'+button('Back to library','library','primary')+'</section>';
}
function plan(){let per=Math.round(p.minutes/p.targets.length);app.innerHTML='<span class="eyebrow">A routine, made for you</span><h1>Your next small steps.</h1><div class="hero"><h2>'+p.minutes+' minutes a day · '+(p.mode==='both'?'speak and write':'speak')+'</h2><p>Learning '+p.targets.map(t=>LANG[t]).join(', ')+'. About '+per+' minutes per language if you divide time evenly. You can also alternate languages each day.</p><div class="grid"><div><h3>1 · Remember</h3><p>Spend about '+Math.round(p.minutes*.3)+' minutes recalling due expressions before looking.</p></div><div><h3>2 · Build</h3><p>Spend about '+Math.round(p.minutes*.4)+' minutes on new phrases, meaning, and '+(p.mode==='both'?'writing':'speaking')+'.</p></div><div><h3>3 · Use</h3><p>Spend the remaining time combining phrases in the conversation prompts.</p></div></div></div><h2>What this course can do</h2><p>Keep all eight original conversation units, and add 207 core-word entries in each language: people, numbers, family, animals, body, actions, nature, colors, time, descriptions and connecting words. Repeat units with your own details and practise recalling them on different days.</p><h2>What comes after</h2><p>Fluency requires a much larger vocabulary, grammar, listening variety, and spontaneous interaction. This expanded foundation library does not provide a complete route to fluency or certify a CEFR level. Your saved speaking levels are self-reported, not placement-test results.</p><p>Do not rush to finish the cards. Being able to use expressions later matters more than completing a screen.</p>'+button('Start today’s practice','daily','primary')}
function download(name,content,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function settings(){app.innerHTML='<section class="narrow"><span class="eyebrow">Your space</span><h1>Keep learning comfortable.</h1><div class="card"><h2>Reading comfort</h2><label><input id="largeText" type="checkbox" '+(document.documentElement.classList.contains('large-text')?'checked':'')+'>Larger text</label><p>Layouts adapt to your screen and browser zoom. Your text preference stays on this device.</p></div><div class="card"><h2>Profiles on this device</h2>'+db.profiles.map(q=>'<p><button data-profile="'+esc(q.id)+'">'+esc(q.name)+(q===p?' · active':'')+'</button></p>').join('')+button('Add a learner','new')+'</div>'+(p?'<div class="card"><h2>Practice preferences</h2><label>Daily commitment<select id="setMinutes">'+[15,30,45,60].map(n=>'<option '+(n===p.minutes?'selected':'')+' value="'+n+'">'+n+' minutes</option>').join('')+'</select></label><label>Learning mode<select id="setMode"><option value="both" '+(p.mode==='both'?'selected':'')+'>Speaking and writing</option><option value="speak" '+(p.mode==='speak'?'selected':'')+'>Speaking only</option></select></label></div>':'')+'<div class="card"><h2>Offline & backups</h2><p>All lessons are bundled. No analytics, remote fonts, AI service, or cloud speech. Progress belongs to this browser and can be lost if browser data is cleared.</p><p>You can download this page and open it without an internet connection. Device speech requires an installed local voice. Progress storage for downloaded files varies by browser; keep backups.</p><div class="row">'+button('Export progress backup','export')+button('Download offline page','download')+'</div><label>Restore a JSON backup<input id="import" type="file" accept=".json,application/json"></label><p>Import adds profiles as separate copies, keeping your existing learners.</p><p id="offlineState">Downloaded HTML works offline immediately. Hosted offline caching is checked when the page opens.</p></div></section>';document.querySelector('#import').addEventListener('change',async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>2000000)throw Error('Backup is too large.');let x=JSON.parse(await f.text());if(!valid(x))throw Error('This is not a valid Lingua Local backup.');if(db.profiles.length+x.profiles.length>30)throw Error('At most 30 profiles are supported.');x.profiles.forEach(q=>{q.id=uid();q.session=null;db.profiles.push(q)});save();notify('Backup restored as additional profiles. Select one to continue.');settings()}catch(err){notify('Import failed: '+err.message)}})}
function setTextSize(large){document.documentElement.classList.toggle('large-text',large);try{localStorage.setItem('lingua-local-large-text',large?'1':'0')}catch{}}
try{document.documentElement.classList.toggle('large-text',localStorage.getItem('lingua-local-large-text')==='1')}catch{}
function uid(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
app.addEventListener('input',e=>{if(e.target.id==='search')filterLibrary(e.target.value)});
app.addEventListener('change',e=>{if(e.target.id==='largeText')setTextSize(e.target.checked);if(['collection','topic'].includes(e.target.id))filterLibrary(document.querySelector('#search').value);if(e.target.id==='source'){collect();draft.targets=draft.targets.filter(t=>t!==draft.source);setup()}if(e.target.id==='course'){p.target=+e.target.value;p.session=null;save();render()}if(e.target.id==='setMinutes'){p.minutes=+e.target.value;save()}if(e.target.id==='setMode'){p.mode=e.target.value;p.session=null;save()}});
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.nav){go(b.dataset.nav);return}if(b.dataset.profile){libraryState={term:'',collection:'all',topic:'all',page:0};p=db.profiles.find(q=>q.id===b.dataset.profile);db.active=p.id;save();go('home');return}if(b.dataset.entry!==undefined){start([+b.dataset.entry]);return}if(b.dataset.unit!==undefined){start(UNIT_IDS[+b.dataset.unit]);return}let a=b.dataset.action;if(!a)return;if(a==='new'){newProfile();return}if(a==='addKnown'){collect();if(draft.known.length<12)draft.known.push({language:'',level:'A1',write:false});setup();return}if(a==='back'){collect();step--;setup();return}if(a==='cancelSetup'){go('home');return}if(a==='next'){collect();if(step===0&&(!draft.name||draft.known.some(k=>!k.language))){notify('Please enter a nickname and the languages you speak.');return}if(step===1&&!draft.targets.length){notify('Choose at least one different language to learn.');return}notify('');if(step<2){step++;setup()}else{if(db.profiles.length>=30){notify('Maximum 30 profiles.');return}p={...draft,id:uid(),target:draft.targets[0],cards:{},days:{},session:null};db.profiles.push(p);db.active=p.id;save();go('plan')}return}if(a==='clearFilters'){libraryState={term:'',collection:'all',topic:'all',page:0};library();}if(a==='sources')go('sources');if(a==='library')go('library');if(a==='practiceFiltered')start(libraryMatches.slice(libraryPage*24,libraryPage*24+12));if(a==='prevLibrary'||a==='nextLibrary'){libraryPage+=a==='nextLibrary'?1:-1;filterLibrary(document.querySelector('#search').value,true);document.querySelector('#resultCount').scrollIntoView({block:'start'});}if(a==='daily')daily();if(a==='pause'||a==='home')go('home');if(a==='recall'){session.stage='recall';session.revealed=false;save();lesson()}if(a==='reveal')reveal();if(a?.startsWith('rate'))rate(+a.slice(4));if(a==='listen')speak();if(a==='export')download('lingua-local-progress.json',JSON.stringify(db,null,2),'application/json');if(a==='download'){let clone=document.documentElement.cloneNode(true);clone.querySelector('#app').innerHTML='';clone.querySelector('#status').textContent='';download('lingua-local.html','<!doctype html>\n'+clone.outerHTML,'text/html')}});
let lastTick=Date.now();setInterval(()=>{let now=Date.now(),elapsed=Math.min(15,(now-lastTick)/1000);lastTick=now;if(p&&view==='lesson'&&!document.hidden){p.days[day()]=(p.days[day()]||0)+elapsed;save()}},10000);
window.addEventListener('pagehide',save);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>notify('Offline lesson cache ready. Progress is saved on this device.')).catch(()=>notify('Offline cache unavailable. Use Settings → Download offline page.'));
render();
</script></body></html>
