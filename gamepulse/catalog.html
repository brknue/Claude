<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Catalog — GamePulse</title>
<style>:root{--bg:#0b1120;--card:#111a2e;--line:#22304d;--ink:#e6ecf5;--mut:#93a1b8;--acc:#38bdf8}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc)}.wrap{max-width:960px;margin:0 auto;padding:16px}
nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav .brand{font-weight:800;color:var(--ink);text-decoration:none;font-size:18px}nav .links{display:flex;gap:16px;font-size:15px}
h1{font-size:clamp(28px,6vw,44px);line-height:1.15;margin:28px 0 10px}h2{font-size:20px;margin:28px 0 12px}
.mut{color:var(--mut)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none;color:var(--ink)}
.card:hover,.card:focus-visible{border-color:var(--acc)}.card small{display:block;color:var(--mut);margin-top:4px}
.search{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.search input{flex:1 1 220px;min-width:0;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
button{font:inherit;cursor:pointer;padding:12px 16px;border-radius:10px;border:0;background:var(--acc);color:#04111f;font-weight:700}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500;padding:6px 10px}
.results{display:flex;flex-wrap:wrap;gap:8px}.results a{padding:8px 12px;border:1px solid var(--line);border-radius:999px;text-decoration:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}.chips a{padding:6px 12px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink)}.chips a.on{border-color:var(--acc);color:var(--acc)}
.big{font-size:56px;line-height:1}.bar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.bar[hidden]{display:none}footer{border-top:1px solid var(--line);margin-top:40px;padding:20px 16px;color:var(--mut);font-size:13px;text-align:center}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}</style>
</head>
<body>
<nav><a class="brand" href="index.html">Game<span style="color:#38bdf8">Pulse</span></a><div class="links"><a href="catalog.html">Catalog</a><a href="../citypulse/index.html">CityPulse →</a></div></nav>
<main class="wrap">
<h1>Catalog</h1>
<div class="chips" id="chips"></div>
<div class="search"><input id="f" type="search" placeholder="Filter this list…" aria-label="Filter this list"></div>
<div class="grid" id="list"></div>
<p class="mut" id="none" hidden>Nothing in this list matches. Search the web instead:</p>
<div class="search"><input id="q" type="search" placeholder="Search any game…" aria-label="Search any game…"><button id="go">Search</button></div>
<div id="res" class="results" aria-live="polite"></div>
</main>
<footer>GamePulse · Not affiliated with any game, studio or store named here. Names are trademarks of their owners.</footer>
<script>
const ITEMS={"gta-6": {"name": "Grand Theft Auto VI", "icon": "🚗", "tag": "Console & PC · Rockstar Games", "group": "Console & PC", "note": "Open-world action game from Rockstar Games."}, "minecraft": {"name": "Minecraft", "icon": "⛏️", "tag": "Console, PC & Mobile · Mojang", "group": "Console & PC", "note": "Block-building sandbox game: survive, explore and build."}, "fortnite": {"name": "Fortnite", "icon": "🪂", "tag": "Console, PC & Mobile · Epic Games", "group": "Console & PC", "note": "Online battle royale and creative building game."}, "clash-royale": {"name": "Clash Royale", "icon": "👑", "tag": "Mobile · Supercell", "group": "Mobile", "note": "Real-time card and tower battle game."}, "blox-fruits": {"name": "Blox Fruits", "icon": "🍎", "tag": "Roblox experience", "group": "Roblox", "note": "Pirate adventure: fight, level up and collect fruit powers."}, "murder-mystery-2": {"name": "Murder Mystery 2", "icon": "🔪", "tag": "Roblox experience", "group": "Roblox", "note": "Find the murderer before time runs out."}, "brookhaven": {"name": "Brookhaven RP", "icon": "🏡", "tag": "Roblox experience", "group": "Roblox", "note": "Town role-play: houses, cars and jobs."}, "adopt-me": {"name": "Adopt Me!", "icon": "🐣", "tag": "Roblox experience", "group": "Roblox", "note": "Raise and trade pets in a family role-play world."}};
const SEARCH=[["RAWG", "https://rawg.io/search?query=", ""], ["Steam", "https://store.steampowered.com/search/?term=", ""], ["Wikipedia", "https://en.wikipedia.org/w/index.php?search=", "+video+game"]];

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function searchLinks(q,box){q=q.trim();box.innerHTML='';if(!q)return;const e=encodeURIComponent(q);
 box.innerHTML='<span class="mut">Search “'+esc(q)+'” on:</span> '+SEARCH.map(s=>'<a href="'+s[1]+e+s[2]+'" target="_blank" rel="noopener noreferrer">'+s[0]+' ↗</a>').join('');}
function wire(inputId,btnId,boxId){const i=document.getElementById(inputId),b=document.getElementById(btnId),x=document.getElementById(boxId);
 b.addEventListener('click',()=>searchLinks(i.value,x));i.addEventListener('keydown',ev=>{if(ev.key==='Enter')searchLinks(i.value,x)});}

wire('q','go','res');
const GROUPS=["Console & PC", "Mobile", "Roblox"];const KEY='game';
let group=new URLSearchParams(location.search).get('group')||'';if(!GROUPS.includes(group))group='';
function draw(){const f=document.getElementById('f').value.trim().toLowerCase();
 document.getElementById('chips').innerHTML=['',...GROUPS].map(g=>'<a href="?'+(g?'group='+encodeURIComponent(g):'')+'" class="'+(g===group?'on':'')+'">'+(g||'All')+'</a>').join('');
 const rows=Object.entries(ITEMS).filter(([s,v])=>(!group||v.group===group)&&(!f||(v.name+' '+v.tag).toLowerCase().includes(f)));
 document.getElementById('list').innerHTML=rows.map(([s,v])=>'<a class="card" href="track.html?'+KEY+'='+s+'"><span style="font-size:28px">'+v.icon+'</span><br><strong>'+esc(v.name)+'</strong><small>'+esc(v.tag)+'</small></a>').join('');
 document.getElementById('none').hidden=rows.length>0;}
document.getElementById('f').addEventListener('input',draw);draw();
</script>
</body>
</html>
