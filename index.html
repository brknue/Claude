<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="plain — every project by CRB in one simple list. Open, download or read each one.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" id="themeColor">
<title>plain — CRB</title>
<link rel="icon" href="plain/icon.svg" type="image/svg+xml">
<script>
/* Set theme before first paint to avoid a flash. */
(function () { var t = null; try { t = localStorage.getItem('plain.theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t); })();
</script>
<style>
:root{--bg:#fff;--fg:#111;--mut:#666;--line:#e5e5e5;--hover:#f6f6f6;--btn:#111;--btnfg:#fff}
[data-theme=dark]{--bg:#000;--fg:#eee;--mut:#9a9a9a;--line:#2a2a2a;--hover:#111;--btn:#eee;--btnfg:#000}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Helvetica,Arial,sans-serif}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 40px max(16px,env(safe-area-inset-right))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
.logo{font-weight:800;font-size:20px;letter-spacing:.06em;text-decoration:none}
.right{display:flex;align-items:center;gap:8px}
select,.iconbtn{height:40px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:0 10px;cursor:pointer}
select{max-width:46vw}
.iconbtn{width:40px;padding:0;display:inline-grid;place-items:center}
.navbtn{height:40px;border:1px solid var(--line);border-radius:8px;padding:0 12px;display:inline-flex;align-items:center;text-decoration:none;font-weight:600}
.navbtn:hover{background:var(--hover)}
.search{width:100%;height:46px;border:1px solid var(--line);border-radius:8px;padding:0 14px;background:var(--bg);margin:8px 0 12px;-webkit-appearance:none;appearance:none}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--mut);font-size:14px;margin-bottom:8px}
.views{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.views button{border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--mut);min-height:36px}
.views button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
#items{list-style:none;margin:0;padding:0}
.item{border-top:1px solid var(--line)}
.item:last-child{border-bottom:1px solid var(--line)}
.item button{display:block;width:100%;text-align:start;background:none;border:0;padding:14px 4px;cursor:pointer;border-radius:0}
.item button:hover{background:var(--hover)}
.name{font-weight:650;display:block}
.desc{color:var(--mut);display:block;font-size:15px;margin-top:2px}
.meta{color:var(--mut);display:block;font-size:12px;margin-top:4px;letter-spacing:.02em}
.grid #items{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.grid .item{border:1px solid var(--line);border-radius:10px}
.grid .item button{padding:16px;height:100%;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-start}
.empty{color:var(--mut);padding:24px 0}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg{padding:20px;overflow:auto}
.dhead{display:flex;justify-content:space-between;align-items:start;gap:12px}
.dhead h2{margin:0;font-size:22px}
.dlg p{margin:8px 0}
.actions{display:grid;gap:8px;margin:16px 0 8px}
.actions a,.actions button{display:flex;align-items:center;justify-content:center;min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-decoration:none;cursor:pointer;padding:8px 12px;text-align:center}
.actions .primary{background:var(--btn);color:var(--btnfg);border-color:var(--btn);font-weight:650}
.actions .off{color:var(--mut);cursor:default}
.note{color:var(--mut);font-size:14px}
footer{color:var(--mut);font-size:13px;padding:28px 0 8px;display:flex;flex-wrap:wrap;gap:6px 14px}
footer button{background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;color:inherit}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:9}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:420px){.desc{font-size:14px}}
@media (max-width:480px){header{gap:8px;flex-wrap:wrap}.right{gap:6px;flex-wrap:wrap;justify-content:flex-end}select{max-width:34vw}.navbtn{padding:0 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="./" aria-label="CRB — plain">CRB</a>
    <div class="right">
      <a class="navbtn" href="/research/">Research</a>
      <a class="navbtn" href="/learning/">Learning</a>
      <a class="navbtn" href="/games/">Games</a>
      <label class="vh" for="lang" data-t="language">Language</label>
      <select id="lang"></select>
      <button class="iconbtn" id="theme" type="button" aria-label="Dark mode"></button>
    </div>
  </header>
  <main>
    <h1 class="vh">plain</h1>
    <label class="vh" for="q" data-t="search">Search projects</label>
    <input class="search" id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search projects">
    <div class="bar">
      <span id="count" aria-live="polite"></span>
      <span class="views" role="group" aria-label="View">
        <button type="button" id="vList" data-t="list" aria-pressed="true">List</button><button type="button" id="vGrid" data-t="grid" aria-pressed="false">Grid</button>
      </span>
    </div>
    <ul id="items"></ul>
    <p class="empty" id="empty" hidden data-t="none">No project matches your search.</p>
  </main>
  <footer>
    <span>plain</span>
    <span data-t="footer">Made by CRB with Claude.</span>
    <button type="button" id="privacyBtn" data-t="privacy">Privacy</button>
    <a href="https://github.com/brknue/claude" rel="noopener">GitHub</a>
  </footer>
</div>

<dialog id="dlg" aria-labelledby="dName">
  <div class="dlg">
    <div class="dhead"><h2 id="dName"></h2><button class="iconbtn" id="dClose" type="button" aria-label="Close">✕</button></div>
    <p id="dDesc"></p>
    <p class="note" id="dMeta"></p>
    <div class="actions" id="dActions"></div>
    <p class="note" id="dNotes"></p>
  </div>
</dialog>

<dialog id="pdlg" aria-labelledby="pTitle">
  <div class="dlg">
    <div class="dhead"><h2 id="pTitle" data-t="privacy">Privacy</h2><button class="iconbtn" id="pClose" type="button" aria-label="Close">✕</button></div>
    <p id="pText" data-t="privacyText"></p>
  </div>
</dialog>

<noscript><p style="padding:16px">plain needs JavaScript. All projects are also on <a href="https://github.com/brknue/claude">GitHub</a>.</p></noscript>
<script src="plain/i18n.js?v=5aac91543c"></script>
<script src="plain/projects.js?v=5aac91543c"></script>
<script src="plain/files.js?v=5aac91543c"></script>
<script src="plain/zip.js?v=5aac91543c"></script>
<script src="plain/app.js?v=5aac91543c"></script>
</body>
</html>
