<style>
/* Layout: one calm column; the noun sits alone like a dictionary headword, the three article colours carry all the meaning. */
:root{
  --bg:#f1f4f8; --surface:#ffffff; --ink:#152033; --muted:#566277; --line:#d6dde8;
  --der:#1d5bcc; --die:#c22f49; --das:#16794a; --warn:#9a5b00;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f141c; --surface:#18202c; --ink:#e9eef6; --muted:#9ba8bb; --line:#2b3646;
  --der:#74a7ff; --die:#ff8496; --das:#5fd39a; --warn:#f0b452; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f141c; --surface:#18202c; --ink:#e9eef6; --muted:#9ba8bb; --line:#2b3646;
  --der:#74a7ff; --die:#ff8496; --das:#5fd39a; --warn:#f0b452; color-scheme:dark }
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,select,summary,input,textarea,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--der);outline-offset:2px}
.m{--c:var(--der)} .f{--c:var(--die)} .n{--c:var(--das)}
.art{color:var(--c);font-weight:600}

header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:16px 0}
.brand{font:600 20px/1 var(--serif);margin-right:auto;white-space:nowrap}
.brand b{font-weight:600}
nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
nav button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:500;color:var(--muted)}
nav button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.lang{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
h1{font:600 clamp(30px,6vw,44px)/1.1 var(--serif);margin:0;text-wrap:balance}
h2{font:600 22px/1.2 var(--serif);margin:0;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:14px 22px;font-weight:600;background:var(--ink);color:var(--bg)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{border-top:2px solid var(--line);padding-top:10px;min-width:0}
.stat b{display:block;font:600 26px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .solid{background:var(--das)} .bar .learn{background:var(--der)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));background:color-mix(in srgb,var(--c) 9%,var(--surface));border-radius:999px;padding:5px 12px;font-size:14px}
select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}

/* quiz card */
.progress{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);transition:width .25s}
.card{text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center;padding:32px 20px}
.tag{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.word{font:600 clamp(34px,9vw,60px)/1.1 var(--serif);overflow-wrap:anywhere;hyphens:auto;max-width:100%}
.word .blank{color:var(--muted);font-weight:500}
.gloss{color:var(--muted);font-size:17px;min-height:26px}
.entry{font:500 15px/1.4 var(--serif);color:var(--muted)}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:480px}
.choice{border:2px solid var(--c);background:var(--surface);background:color-mix(in srgb,var(--c) 10%,var(--surface));color:var(--c);border-radius:14px;padding:16px 4px 12px;font:600 24px/1 var(--serif);display:flex;flex-direction:column;gap:8px;align-items:center}
.choice kbd{font:500 11px var(--sans);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--surface)}
.choice:disabled{cursor:default;opacity:.35}
.choice.right{opacity:1;background:var(--c);color:var(--surface)}
.choice.wrong{opacity:1;border-style:dashed;text-decoration:line-through}
.fb{width:100%;max-width:480px;border-radius:12px;padding:12px 14px;text-align:left;font-size:15px;border:1px solid var(--line);background:var(--bg);min-height:48px}
.fb strong{display:block}
.fb.ex strong{color:var(--warn)}
.fb.no{border-color:var(--die)}
@media (prefers-reduced-motion:no-preference){ .pop{animation:pop .25s ease-out} @keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:none;opacity:1}} }

/* levels */
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.cell{aspect-ratio:1;border:1px solid var(--line);border-radius:7px;background:linear-gradient(to top,var(--das) var(--p),var(--surface) var(--p));background:linear-gradient(to top,color-mix(in srgb,var(--das) 55%,var(--surface)) var(--p),var(--surface) var(--p));font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;padding:0;min-width:0}
.cell[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
.cell.focus{border-color:var(--der);border-width:2px}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.item .w{font:500 17px var(--serif);overflow-wrap:anywhere}
.item .e{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.pill{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.s2{border-color:var(--das);color:var(--das)} .pill.s1{border-color:var(--der);color:var(--der)}
input[type=search],textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
textarea{min-height:70px;font:12px/1.4 ui-monospace,Consolas,monospace}

/* rules */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.rule{border:1px solid var(--line);border-top:4px solid var(--c);border-radius:var(--r);background:var(--surface);padding:18px;min-width:0}
.rule h2{color:var(--c);font-size:30px}
.rule dl{margin:12px 0 0;display:flex;flex-direction:column;gap:10px}
.rule dt{font-weight:600}
.rule dd{margin:0;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
details summary{cursor:pointer;font-weight:600}
/* every device: mouse hover, touch screens, narrow phones, landscape phones, small old phones */
@media (hover:hover){ .btn:not(:disabled):hover{filter:brightness(1.12)} .btn.ghost:not(:disabled):hover{background:var(--bg);filter:none} .choice:not(:disabled):hover{transform:translateY(-1px)} nav button:not([aria-current="true"]):hover{color:var(--ink)} .cell:hover{border-color:var(--muted)} }
@media (hover:none),(pointer:coarse){ .choice kbd{display:none} .choice{min-height:68px;justify-content:center;padding:18px 4px} .btn,.lang,nav button,select{min-height:44px} .btn.small{min-height:40px} input[type=search],textarea,select{font-size:16px} details summary{padding-block:6px} }
@media (max-width:560px){ header{display:grid;grid-template-columns:1fr auto;row-gap:12px} nav{grid-column:1/-1;grid-row:2} nav button{flex:1} .card{padding:24px 14px} }
@media (max-height:520px) and (orientation:landscape){ header{padding-block:8px 0} .wrap{gap:12px} .card{padding:14px;gap:10px} .word{font-size:clamp(28px,7vh,44px)} .choice{min-height:52px;padding:10px 4px} }
@media (max-width:350px){ .choice{font-size:20px} .btn{padding:12px 16px} .stat b{font-size:19px} .stat span{font-size:12px} .grid{gap:3px} }
@media (min-width:1100px){ .wrap{max-width:820px} }
@media (max-width:520px){ .panel{padding:18px} .stats{gap:8px} .stat b{font-size:22px} nav button{padding:7px 10px;font-size:14px} .cell{font-size:10px} .item{grid-template-columns:minmax(0,1fr) auto} .item .e{grid-column:1/-1;order:3;margin-top:-6px} }
</style>
</head>

const SHORT=new Set('tag zug rad bad eis uhr tür hut tee amt tal ort bus weg hof öl ei'.split(' '));
const NOCOMP=new Set('Apparat Demokrat Bürokrat Aristokrat Export Import Komfort Schwarm Mitglied Kontrolle Beschwerde Kontrast Palast Oberschenkel Geschrei Medizin Disziplin Programm Diagramm Telegramm Monogramm Hologramm Organigramm Flasche Strauch Kapital Schimmel Gazelle Fischotter Zypresse Schranke Terrasse Pfosten Konstante Blindschleiche Diebstahl'.split(' '));
const PRE=new Set('vor nach auf aus ein an ab um über unter haupt neben hinter groß klein alt neu hoch rück zwischen mit bei zu gegen wieder ur un miss fern nah voll halb selbst schnell früh spät rot weiß schwarz grün wohn ess schlaf fahr lauf lenk koch back bade wasch spiel lese schreib trink sitz steh park renn tret schwimm turn tanz wander kauf warte bau lehr lern hör seh reit spül putz näh strick mal sing dreh kühl heiz brat grill mess wechsel misch halte lade spar miet leih prüf probe dienst'.split(' '));
function compound(o){
  if(NOCOMP.has(o.w))return null;const l=o.w.toLowerCase().replace(/-/g,'');
  let fb=null;
  for(let k=2;k<=l.length-2;k++){const t=l.slice(k),short=t.length<4;if(short&&!(SHORT.has(t)&&k>=3))continue;const c=MAP[t];if(!c||c===o||c.g!==o.g)continue;
    const p=l.slice(0,k),known=PRE.has(p)||[p,p+'e',p+'en',p.replace(/(es|en|s|n|e)$/,'')].some(x=>x.length>2&&MAP[x]);
    if(known)return c;if(!fb&&(t.length>=5||short))fb=c}
  return fb;
}
function hint(o){
  const w=o.w,g=o.g,l=w.toLowerCase(),a=ART[g];
  if(SEM.has(w))return{t:L('Tage, Monate, Jahreszeiten und Himmelsrichtungen sind immer der.','Days, months, seasons and compass points are always der.')};
  for(const[e,rg,min,sure]of END){
    if(!l.endsWith(e)||w.length<min)continue;
    if(e==='chen'&&(g!=='n'||/zeichen$/.test(l)))continue;
    if(e==='ung'&&/(sprung|schwung)$/.test(l))continue;
    if(e==='um'&&/aum$/.test(l))continue;
    if(e==='anz'&&/schwanz$/.test(l))continue;
    if(e==='ei'&&g==='n')continue;
    if(e==='ling'&&g==='n')continue;
    if(e==='ment'&&g==='m')continue;
    if(e==='ur'&&/schwur$/.test(l))continue;
    if(g===rg)return{t:L(`Merkhilfe: Nomen auf -${e} sind ${sure?'immer':'fast immer'} ${a}.`,`Memory aid: nouns ending in -${e} are ${sure?'always':'almost always'} ${a}.`)};
    {const c=compound(o);if(c)return{t:L(`Zusammengesetztes Wort: der letzte Teil bestimmt den Artikel. ${a} ${c.w} → ${a} ${w}.`,`Compound word: the last part decides the article. ${a} ${c.w} → ${a} ${w}.`)}}
    return{ex:1,t:L(`Ausnahme! Nomen auf -${e} sind sonst meistens ${ART[rg]}.`,`Exception! Nouns ending in -${e} are usually ${ART[rg]}.`)};
  }
  if(g==='f'&&/[^e]in$/.test(l)&&w.length>=6&&!NOCOMP.has(w))return{t:L('Merkhilfe: weibliche Personen auf -in sind immer die.','Memory aid: female persons ending in -in are always die.')};
  const c=compound(o);
  if(c)return{t:L(`Zusammengesetztes Wort: der letzte Teil bestimmt den Artikel. ${a} ${c.w} → ${a} ${w}.`,`Compound word: the last part decides the article. ${a} ${c.w} → ${a} ${w}.`)};
  if(g==='n'&&/^ge/.test(l)&&w.length>=6)return{t:L('Merkhilfe: viele Nomen mit Ge- sind das.','Memory aid: many nouns starting with Ge- are das.')};
  if(/[^ei]e$/.test(l)&&w.length>=4){
    if(g==='f')return{t:L('Merkhilfe: die meisten Nomen auf -e sind die.','Memory aid: most nouns ending in -e are die.')};
    if(g==='m')return{ex:1,t:L('Ausnahme! Nomen auf -e sind meistens die. Einige sind der, oft männliche Personen und Tiere.','Exception! Nouns ending in -e are usually die. Some are der, often male persons and animals.')};
    return{ex:1,t:L('Ausnahme! Nomen auf -e sind meistens die.','Exception! Nouns ending in -e are usually die.')};
  }
  if(g==='n'&&/en$/.test(l)&&/ing$/.test(o.e))return{t:L('Merkhilfe: ein Verb als Nomen ist immer das.','Memory aid: a verb used as a noun is always das.')};
  if(g==='m'&&/er$/.test(l)&&w.length>=5)return{t:L('Merkhilfe: viele Nomen auf -er sind der, vor allem Personen und Geräte.','Memory aid: many nouns ending in -er are der, especially persons and devices.')};
  if(g==='m'&&/en$/.test(l)&&w.length>=5)return{t:L('Merkhilfe: die meisten Nomen auf -en sind der.','Memory aid: most nouns ending in -en are der.')};
  return null;
}

/* ---------- progress ---------- */
const box=i=>S.p[i]?S.p[i][0]:-1;
function counts(){let learned=0,solid=0,due=0,hard=0;const t=today();for(const k in S.p){const r=S.p[k];if(r[0]>=1){learned++;if(r[1]<=t)due++}if(r[0]>=5)solid++;if((r[2]||0)>=2&&r[0]<5)hard++}return{learned,solid,due,hard}}
function levelStat(l){let a=0,n=0;for(let i=l*LV;i<Math.min(W.length,(l+1)*LV);i++){n++;if(box(i)>=1)a++}return{a,n}}
function currentLevel(){if(S.focus!=null){const s=levelStat(S.focus);if(s.a<s.n)return S.focus}for(let l=0;l<NL;l++){const s=levelStat(l);if(s.a<s.n)return l}return NL-1}
function nextNew(n){const out=[];for(const k in S.p)if(S.p[k][0]===0&&out.length<n)out.push(+k);const start=currentLevel()*LV;
  for(let i=start;i<W.length&&out.length<n;i++)if(!S.p[i])out.push(i);for(let i=0;i<start&&out.length<n;i++)if(!S.p[i])out.push(i);return out}

/* ---------- session ---------- */
let ses=null,timer=null,view='lernen',selLv=null,query='';
function build(mode){
  const t=today(),q=[];let rev=[],fresh=[];
  const keys=Object.keys(S.p).map(Number);
  if(mode==='hard')rev=keys.filter(i=>(S.p[i][2]||0)>=2&&S.p[i][0]>=1&&S.p[i][0]<5).slice(0,30);
  else rev=keys.filter(i=>S.p[i][0]>=1&&S.p[i][1]<=t).sort((a,b)=>S.p[a][1]-S.p[b][1]).slice(0,40);
  shuffle(rev).forEach(i=>q.push({i,k:'q',fin:true}));
  if(mode!=='hard'){fresh=nextNew(S.n);
    for(let a=0;a<fresh.length;a+=5){const b=fresh.slice(a,a+5);b.forEach(i=>q.push({i,k:'i'}));shuffle(b.slice()).forEach(i=>q.push({i,k:'q',fin:false,nw:true}))}
    shuffle(fresh.slice()).forEach(i=>q.push({i,k:'q',fin:true,nw:true}))}
  ses={q,pos:0,wrong:new Set(),ok:0,bad:0,newN:fresh.length,revN:rev.length,ans:null,mode,missed:[]};
}
// ask the browser not to clear saved progress (Safari otherwise may after a few weeks without visits)
let persistAsked=false;
function askPersist(){if(persistAsked)return;persistAsked=true;try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}}
function touchStreak(){const t=today();if(S.st.d===t)return;S.st.c=S.st.d===t-1?S.st.c+1:1;S.st.d=t}
function answer(g){
  if(!ses||ses.ans)return;const it=ses.q[ses.pos];if(!it||it.k!=='q')return;
  const o=W[it.i],ok=g===o.g,pr=S.p[it.i]||(S.p[it.i]=[0,today(),0]);ses.ans={g,ok};
  if(ok){ses.ok++;if(it.fin){const b=it.nw||ses.wrong.has(it.i)?1:Math.min(6,pr[0]+1);pr[0]=b;pr[1]=today()+IV[b]}}
  else{ses.bad++;if(!ses.wrong.has(it.i))ses.missed.push(it.i);ses.wrong.add(it.i);pr[2]=(pr[2]||0)+1;if(!it.nw){pr[0]=1;pr[1]=today()}
    ses.q.splice(Math.min(ses.q.length,ses.pos+4),0,Object.assign({},it))}
  touchStreak();save();askPersist();render();
  // correct and no exception to read: move on by itself; otherwise wait so the rule can be read
  const h=hint(o);if(ok&&!(h&&h.ex))timer=setTimeout(next,1400);
}
function next(){clearTimeout(timer);if(!ses)return;const it=ses.q[ses.pos];
  if(it&&it.k==='i'&&!S.p[it.i]){S.p[it.i]=[0,today(),0];save()}
  ses.ans=null;ses.pos++;render();const b=document.querySelector('[data-focus]');if(b)b.focus()}

    </div>
    <div class="bar" role="img" aria-label="${L('Fortschritt','Progress')}"><i class="solid" style="width:${pl}%"></i><i class="learn" style="width:${pg}%"></i></div>
    <div class="legend"><span><i style="background:var(--das)"></i>${L('sicher','known well')}</span><span><i style="background:var(--der)"></i>${L('in Wiederholung','in review')}</span><span><i style="background:var(--line)"></i>${L('noch neu','still new')}</span></div>
  </section>
  ${fresh.length?`<section class="panel stack"><h2>${L('Als Nächstes','Coming next')}</h2><div class="chips">${fresh.slice(0,12).map(i=>`<span class="chip ${W[i].g}">${wd(W[i])}</span>`).join('')}</div>
    <p class="muted" style="margin:0;font-size:14px">${L('Blau ist der, Rot ist die, Grün ist das. Lerne jedes Nomen immer zusammen mit seiner Farbe.','Blue is der, red is die, green is das. Always learn each noun together with its colour.')}</p></section>`:''}
  <section class="panel"><details><summary>${L('Fortschritt sichern oder übertragen','Back up or move your progress')}</summary><div class="stack" style="margin-top:12px">
    <p class="muted" style="margin:0;font-size:14px">${L('Dein Fortschritt liegt nur in diesem Browser. Kopiere den Code und füge ihn auf einem anderen Gerät ein, um dort weiterzulernen.','Your progress is stored in this browser only. Copy the code and paste it on another device to continue there.')}</p>
    <textarea id="backup" aria-label="Code" spellcheck="false"></textarea>
    <div class="row"><button class="btn ghost small" data-act="exp">${L('Code erzeugen und kopieren','Create and copy code')}</button><button class="btn ghost small" data-act="imp">${L('Code einlesen','Load code')}</button><span id="bmsg" class="muted" style="font-size:14px"></span></div>
  </div></details></section></div>`;
}
function vCard(){
  const it=ses.q[ses.pos],o=W[it.i],h=hint(o),pct=100*ses.pos/ses.q.length;
  const head=`<div class="row" style="justify-content:space-between"><span class="muted" style="font-size:14px">${ses.pos+1} / ${ses.q.length}</span><button class="btn ghost small" data-act="quit">${L('Runde beenden','End round')}</button></div><div class="progress"><i style="width:${pct}%"></i></div>`;
  const gloss=`<div class="gloss">${S.en?esc(o.e):''}</div>`;
  if(it.k==='i')return `<div class="stack">${head}<section class="panel card ${o.g} pop">
    <span class="tag">${L('Neues Wort','New word')}</span>
    <div class="word" lang="de"><span class="art">${ART[o.g]}</span> ${esc(o.w)}</div>${gloss}
    <div class="fb${h&&h.ex?' ex':''}">${h?`<strong>${esc(h.t)}</strong>`:`<span class="muted">${L('Sprich es einmal laut: ','Say it out loud once: ')}${ART[o.g]} ${esc(o.w)}.</span>`}</div>
    <button class="btn" data-act="next" data-focus>${L('Weiter','Continue')}</button></section></div>`;
  const a=ses.ans;
  const btn=(g,k)=>`<button class="choice ${g}${a?(g===o.g?' right':a.g===g?' wrong':''):''}" data-act="ans" data-g="${g}"${a?' disabled':''}>${ART[g]}<kbd>${k}</kbd></button>`;
  let fb='';
  if(a){fb=`<div class="fb${a.ok?'':' no'}${h&&h.ex?' ex':''}" role="status"><strong>${a.ok?L('Richtig!','Correct!'):L('Nicht ganz. Richtig ist: ','Not quite. The answer is: ')+ART[o.g]+' '+esc(o.w)}</strong>${h?esc(h.t):''}
    <div class="entry" lang="de">${esc(o.w)}, ${ART[o.g]}</div></div><button class="btn" data-act="next" data-focus>${L('Weiter','Continue')}</button>`}
  return `<div class="stack">${head}<section class="panel card ${a?o.g:''}">
    <span class="tag">${it.nw?L('Neues Wort','New word'):L('Wiederholung','Review')}</span>
    <div class="word" lang="de">${a?`<span class="art">${ART[o.g]}</span>`:'<span class="blank">___</span>'} ${esc(o.w)}</div>${gloss}
    <div class="choices">${btn('m',1)}${btn('f',2)}${btn('n',3)}</div>${fb}</section></div>`;
}
function vDone(){
  const tot=ses.ok+ses.bad,pc=tot?Math.round(100*ses.ok/tot):100,c=counts();
  return `<div class="stack"><section class="panel stack">
    <div class="eyebrow">${L('Runde geschafft','Round complete')}</div>
    <h1>${pc>=90?L('Stark gemacht!','Well done!'):pc>=70?L('Gut gemacht!','Good work!'):L('Dranbleiben lohnt sich.','Keep going, it pays off.')}</h1>
    <div class="stats"><div class="stat"><b>${pc} %</b><span>${L('richtig','correct')}</span></div><div class="stat"><b>${ses.newN}</b><span>${L('neue Wörter','new words')}</span></div><div class="stat"><b>${ses.revN}</b><span>${L('wiederholt','reviewed')}</span></div></div>
    ${ses.missed.length?`<div class="stack" style="gap:8px"><span class="muted">${L('Diese Wörter kommen morgen wieder:','These words come back tomorrow:')}</span><div class="chips">${ses.missed.map(i=>`<span class="chip ${W[i].g}">${wd(W[i])}</span>`).join('')}</div></div>`:''}
    <div class="row"><button class="btn" data-act="start" data-focus>${L('Noch eine Runde','Another round')}</button><button class="btn ghost" data-act="home">${L('Zur Übersicht','Back to overview')}</button></div>
    <p class="muted" style="margin:0;font-size:14px">${c.due?L(`Noch ${c.due} Wiederholungen fällig.`,`${c.due} reviews still due.`):L('Alle Wiederholungen für heute sind erledigt. Komm morgen wieder, dann bleiben die Wörter im Kopf.','All reviews for today are done. Come back tomorrow so the words stick.')}</p>
  </section></div>`;
}
function status(i){const b=box(i);return b>=5?`<span class="pill s2">${L('sicher','known')}</span>`:b>=1?`<span class="pill s1">${L('lernt','learning')}</span>`:`<span class="pill">${L('neu','new')}</span>`}
function vLevels(){
  if(selLv==null)selLv=currentLevel();const cur=currentLevel();
  let cells='';for(let l=0;l<NL;l++){const s=levelStat(l);cells+=`<button class="cell${l===cur?' focus':''}" style="--p:${Math.round(100*s.a/s.n)}%" aria-pressed="${l===selLv}" data-act="lv" data-l="${l}" title="${L('Stufe','Level')} ${l+1}: ${s.a}/${s.n}">${l+1}</button>`}
  let idx=[];const q=query.trim().toLowerCase();
  if(q){for(let i=0;i<W.length&&idx.length<100;i++)if(W[i].w.toLowerCase().includes(q)||W[i].e.toLowerCase().includes(q))idx.push(i)}
  else for(let i=selLv*LV;i<Math.min(W.length,(selLv+1)*LV);i++)idx.push(i);
  const s=levelStat(selLv);
  return `<div class="stack"><section class="panel stack">
    <h2>${NL} ${L('Stufen mit je','levels of')} ${LV} ${L('Wörtern','words each')}</h2>
    <p class="muted" style="margin:0;font-size:14px">${L('Jede Stufe füllt sich grün, während du lernst. Der blaue Rahmen zeigt, wo neue Wörter gerade herkommen.','Each level fills with green as you learn. The blue frame shows where new words currently come from.')}</p>
    <div class="grid">${cells}</div></section>
  <section class="panel stack">
    <input type="search" id="q" placeholder="${L('Wort suchen, deutsch oder englisch','Search a word, German or English')}" value="${esc(query)}" aria-label="${L('Suche','Search')}">
    ${q?`<div class="muted" style="font-size:14px">${idx.length}${idx.length===100?'+':''} ${L('Treffer','matches')}</div>`:`<div class="row" style="justify-content:space-between"><h2>${L('Stufe','Level')} ${selLv+1} <span class="muted" style="font:400 14px var(--sans)">${L('Wörter','words')} ${selLv*LV+1}–${Math.min(W.length,(selLv+1)*LV)} · ${s.a}/${s.n}</span></h2>
      <button class="btn small${selLv===cur?' ghost':''}" data-act="focus"${selLv===cur||s.a===s.n?' disabled':''}>${selLv===cur?L('Hier lernst du gerade','You are learning here'):L('Ab hier weiterlernen','Continue from here')}</button></div>`}
    <div class="list" id="list">${idx.map(i=>`<div class="item"><span class="w" lang="de">${wd(W[i])}</span><span class="e">${esc(W[i].e)}</span>${status(i)}</div>`).join('')||`<p class="muted">${L('Nichts gefunden.','Nothing found.')}</p>`}</div>
  </section></div>`;
}
function examples(test,g){const out=[];for(const o of W){if(o.g===g&&test(o)){out.push(o.w);if(out.length===3)break}}return out.join(', ')}
function vRules(){
  const end=(e,g,min)=>examples(o=>o.w.toLowerCase().endsWith(e)&&o.w.length>=(min||5),g);
  const R={m:[[L('Tage, Monate, Jahreszeiten','Days, months, seasons'),'Montag, Juli, Sommer'],['-ling',end('ling','m')],['-ismus',end('ismus','m')],['-or',end('or','m')],['-ant, -ent, -ist',[end('ant','m',6).split(', ')[0],end('ent','m',6).split(', ')[0],end('ist','m',6).split(', ')[0]].join(', ')],['-ig, -ich',[end('ig','m').split(', ')[0],end('ich','m',6).split(', ')[0]].join(', ')],[L('viele auf -er (Personen, Geräte)','many in -er (persons, devices)'),end('er','m')],[L('die meisten auf -en','most in -en'),end('en','m')]],
   f:[['-ung',end('ung','f')],['-heit, -keit',[end('heit','f').split(', ')[0],end('keit','f').split(', ')[0]].join(', ')],['-schaft',end('schaft','f')],['-ion, -tät',[end('ion','f',6).split(', ')[0],end('tät','f').split(', ')[0]].join(', ')],['-ik, -ur',[end('ik','f').split(', ')[0],end('ur','f').split(', ')[0]].join(', ')],['-ei, -ie',[end('ei','f').split(', ')[0],end('ie','f').split(', ')[0]].join(', ')],['-enz, -anz',[end('enz','f',6).split(', ')[0],end('anz','f',6).split(', ')[0]].join(', ')],[L('weibliche Personen auf -in','female persons in -in'),end('erin','f')],[L('die meisten auf -e','most in -e'),end('e','f')]],
   n:[['-chen, -lein',[end('chen','n').split(', ').slice(0,2).join(', '),end('lein','n',6).split(', ')[0]].join(', ')],['-ment',end('ment','n',6)],['-um, -tum',[end('um','n').split(', ')[0],end('tum','n',6).split(', ')[0]].join(', ')],['-ma',end('ma','n')],[L('Verben als Nomen','verbs used as nouns'),'Essen, Leben, Schwimmen'],[L('viele mit Ge-','many with Ge-'),examples(o=>/^Ge/.test(o.w)&&o.w.length>=6,'n')]]};
  const col=g=>`<section class="rule ${g}"><h2>${ART[g]}</h2><dl>${R[g].map(r=>`<div><dt>${esc(r[0])}</dt><dd lang="de">${esc(r[1])}</dd></div>`).join('')}</dl></section>`;
  return `<div class="stack"><section class="panel stack"><h1>${L('Regeln, die wirklich helfen','Rules that really help')}</h1>
    <p class="muted" style="margin:0;max-width:62ch">${L('Für viele Nomen muss man den Artikel einfach lernen. Aber die Endung verrät ihn oft. Beim Üben siehst du die passende Regel direkt nach jeder Antwort.','For many nouns you simply have to learn the article. But the ending often gives it away. While practising you see the matching rule right after each answer.')}</p></section>
  <div class="rules">${col('m')}${col('f')}${col('n')}</div>
  <section class="panel stack"><h2>${L('Drei Tipps','Three tips')}</h2>
    <p style="margin:0"><b>${L('Der letzte Teil entscheidet.','The last part decides.')}</b> ${L('Bei zusammengesetzten Wörtern zählt nur das letzte Wort: das Haus → das Krankenhaus, die Tür → die Haustür.','In compound words only the last word counts: das Haus → das Krankenhaus, die Tür → die Haustür.')}</p>
    <p style="margin:0"><b>${L('Nie ohne Artikel lernen.','Never learn a noun without its article.')}</b> ${L('Merke dir „der Tisch“ als ein Stück, nicht „Tisch“. Die Farben helfen dem Gedächtnis.','Remember “der Tisch” as one piece, not “Tisch”. The colours help your memory.')}</p>
    <p style="margin:0"><b>${L('Lieber täglich kurz als selten lang.','Short and daily beats long and rare.')}</b> ${L('Eine Runde pro Tag reicht. Bei 10 neuen Wörtern am Tag kennst du alle 5000 in etwa anderthalb Jahren.','One round a day is enough. At 10 new words a day you will know all 5000 in about a year and a half.')}</p>
  </section></div>`;
}
function render(){
  const tabs=[['lernen',L('Lernen','Learn')],['stufen',L('Stufen','Levels')],['regeln',L('Regeln','Rules')]];
  document.getElementById('nav').innerHTML=tabs.map(t=>`<button data-act="tab" data-v="${t[0]}" aria-current="${view===t[0]}">${t[1]}</button>`).join('');
  document.getElementById('lang').textContent=S.lang==='en'?'Deutsch':'English';
  document.documentElement.lang=S.lang;
  const app=document.getElementById('app');
  if(view==='stufen')app.innerHTML=vLevels();
  else if(view==='regeln')app.innerHTML=vRules();
  else if(!ses)app.innerHTML=vStart();
  else if(ses.pos>=ses.q.length)app.innerHTML=vDone();
  else app.innerHTML=vCard();
}
function go(v){view=v;try{history.replaceState(null,'','#'+v)}catch(e){}render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;const a=b.dataset.act;
  if(a==='tab')go(b.dataset.v);
  else if(a==='lang'){S.lang=S.lang==='en'?'de':'en';save();render()}
  else if(a==='start'||a==='hard'){clearTimeout(timer);build(a==='hard'?'hard':'std');if(!ses.q.length)ses=null;view='lernen';render();const f=document.querySelector('[data-focus]');if(f)f.focus()}
  else if(a==='ans')answer(b.dataset.g);
  else if(a==='next')next();
  else if(a==='quit'||a==='home'){clearTimeout(timer);ses=null;render()}
  else if(a==='lv'){selLv=+b.dataset.l;query='';render();const q=document.getElementById('q');if(q&&q.getBoundingClientRect().top>innerHeight*.6)q.scrollIntoView({block:'start'})}
  else if(a==='focus'){S.focus=selLv;save();render()}
  else if(a==='exp'){const t=document.getElementById('backup'),m=document.getElementById('bmsg');let code='';try{code=btoa(unescape(encodeURIComponent(JSON.stringify(S))))}catch(x){}t.value=code;t.select();
    try{navigator.clipboard.writeText(code).then(()=>{m.textContent=L('Kopiert.','Copied.')},()=>{m.textContent=L('Code markiert. Bitte selbst kopieren.','Code selected. Please copy it yourself.')})}catch(x){m.textContent=L('Code markiert. Bitte selbst kopieren.','Code selected. Please copy it yourself.')}}
  else if(a==='imp'){const t=document.getElementById('backup'),m=document.getElementById('bmsg');try{const x=JSON.parse(decodeURIComponent(escape(atob(t.value.trim()))));if(!x||typeof x.p!=='object')throw 0;Object.assign(S,x);save();render()}catch(x){m.textContent=L('Dieser Code ist nicht gültig. Füge den ganzen Code ein.','This code is not valid. Paste the complete code.')}}
});
document.addEventListener('change',e=>{if(e.target.id==='perround'){S.n=+e.target.value;save();render()}});
// search: update only the results, never the field itself, so phone keyboards stay open
document.addEventListener('input',e=>{if(e.target.id!=='q')return;query=e.target.value;
  const live=e.target,sec=live.parentNode,t=document.createElement('div');t.innerHTML=vLevels();
  const ns=t.querySelector('#q').parentNode;ns.querySelector('#q').remove();
  [...sec.childNodes].forEach(n=>{if(n!==live)n.remove()});sec.append(...ns.childNodes)});
document.addEventListener('keydown',e=>{
  if(!ses||view!=='lernen'||e.ctrlKey||e.metaKey||e.altKey)return;const it=ses.q[ses.pos];if(!it)return;
  const tg=e.target;if(tg&&tg.closest){if(tg.closest('input,textarea,select'))return;
    if((e.key==='Enter'||e.key===' ')&&tg.closest('button,summary,a')&&!tg.closest('[data-act=next],[data-act=ans]'))return}
  if(it.k==='q'&&!ses.ans){const g={'1':'m','2':'f','3':'n'}[e.key];if(g){e.preventDefault();answer(g)}}
  else if(e.key==='Enter'||e.key===' '){e.preventDefault();next()}
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['lernen','stufen','regeln'].includes(h)&&h!==view){view=h;render()}});
{const h=location.hash.slice(1);if(['stufen','regeln'].includes(h))view=h}
// progress made in another tab shows up here too; coming back the next day refreshes what is due
window.addEventListener('storage',e=>{if(e.key!==KEY||ses||!e.newValue)return;try{const x=JSON.parse(e.newValue);if(x&&x.p){Object.assign(S,x);render()}}catch(x){}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!ses)render()});
// offline use and "add to home screen" when served from a normal website such as GitHub Pages
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>{try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}})}
render();
</script>
</body>
</html>
